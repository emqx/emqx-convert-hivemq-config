networks:
  emqx-kafka-net:
    driver: bridge

services:
  emqx:
    image: emqx/emqx-enterprise:5.10.0
    container_name: emqx-test
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: 'admin'
    volumes:
      - ./base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./etc/emqx/ssl:/etc/emqx/ssl:ro
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - emqx-kafka-net

  kafka:
    image: apache/kafka:latest
    container_name: kafka.emqx.io
    hostname: kafka.emqx.io
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka.emqx.io:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka.emqx.io:9093'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,PLAINTEXT://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'kafka-cluster'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    networks:
      emqx-kafka-net:
        aliases:
          - kafka.emqx.io

  init-kafka:
    image: apache/kafka:latest
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-e', '-c' ]
    networks:
      emqx-kafka-net:
    command: |
      "
      timeout 30 bash -c 'until echo > /dev/tcp/kafka.emqx.io/9092; do sleep 1; done'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.emqx.io:9092 --list
      echo -e 'Creating kafka topics'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.emqx.io:9092 --create --if-not-exists --topic topic1 --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.emqx.io:9092 --create --if-not-exists --topic topic2 --replication-factor 1 --partitions 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.emqx.io:9092 --create --if-not-exists --topic emqx --replication-factor 1 --partitions 1
      echo -e 'Successfully created the following topics:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka.emqx.io:9092 --list
      "
